name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntax check
        run: |
          python -m py_compile src/pipeline.py src/forecast.py src/risk.py service/main.py app/app.py app/api_client.py

      - name: Unit + functional tests
        run: pytest -q

      - name: Dashboard smoke (AppTest)
        run: pytest -q tests/test_dashboard.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t foresight:ci .

      - name: Compose config sanity
        run: docker compose config -q